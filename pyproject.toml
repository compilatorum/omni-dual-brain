[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "omni-dual-brain"
version = "1.0.0"
description = "Cérebro Único com Duas Fronteiras de Segurança: LangGraph + MCP + WhatsApp Harness + Emacs + Web3 (GitHub/Neynar/KarmaHQ) + Hermes/Archon"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6.0",
    "httpx>=0.27.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.2.0",
    "redis>=5.0.0",
    "supabase>=2.4.0",
    "mcp>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
